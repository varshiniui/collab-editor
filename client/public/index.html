<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draft — Collaborative Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        background: #e8ecf2;
        font-family: 'Sora', sans-serif;
        font-weight: 300;
        color: #1a2030;
        -webkit-font-smoothing: antialiased;
      }
      .ql-toolbar.ql-snow {
        border: none !important;
        border-bottom: 1px solid rgba(26,32,48,0.10) !important;
        padding: 10px 20px !important;
        background: #f4f6fa !important;
        border-radius: 3px 3px 0 0 !important;
        flex-shrink: 0 !important;
      }
      .ql-container.ql-snow {
        border: none !important;
        font-family: 'Lora', Georgia, serif !important;
        font-size: 17px !important;
        font-weight: 400 !important;
        line-height: 1.85 !important;
        color: #1a2030 !important;
        flex: 1 !important;
        overflow-y: auto !important;
        min-height: 0 !important;
      }
      .ql-editor {
        padding: 44px 56px !important;
        min-height: 100% !important;
        max-width: 100% !important;
        overflow-wrap: break-word !important;
        word-wrap: break-word !important;
        word-break: break-word !important;
      }
      .ql-editor p { margin-bottom: 0.5em; }
      .ql-editor h1 { font-size: 2em; font-weight: 500; margin-bottom: 0.4em; color: #0f1520; }
      .ql-editor h2 { font-size: 1.45em; font-weight: 400; margin: 0.8em 0 0.3em; color: #1a2030; }
      .ql-editor h3 { font-size: 1.15em; font-weight: 400; margin: 0.6em 0 0.3em; }
      .ql-editor.ql-blank::before {
        font-style: italic;
        color: rgba(26,32,48,0.28);
        font-family: 'Lora', serif;
      }
      .ql-snow .ql-stroke { stroke: #3d5a8a !important; }
      .ql-snow .ql-fill { fill: #3d5a8a !important; }
      .ql-snow.ql-toolbar button:hover .ql-stroke,
      .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke: #5b8fd4 !important; }
      .ql-snow.ql-toolbar button:hover .ql-fill,
      .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: #5b8fd4 !important; }
      .ql-snow .ql-picker { color: #3d5a8a !important; }
      .ql-snow .ql-picker-label { color: #3d5a8a !important; }
      .ql-snow .ql-picker-options { background: #fff !important; border: 1px solid rgba(26,32,48,0.12) !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
